services:
  - type: web
    name: orca-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orca-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: orca-redis
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: LOG_LEVEL
        value: "info"

databases:
  - name: orca-postgres
    plan: starter
    databaseName: floatchat
    user: postgres

redis:
  - name: orca-redis
    plan: starter